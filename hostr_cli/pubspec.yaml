name: hostr_cli
description: Hostr command-line interface for desktop agents and local automation.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  hostr: hostr
  hostr-cli: hostr
  hostr-daemon: hostr_daemon

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  hostr_sdk:
    path: ../hostr_sdk
  logger: ^2.8.0
  mime: ^2.1.0
  marketplace_models:
    path: ../dependencies/nmdk/packages/marketplace_models
  ndk: ^0.9.3
  path: ^1.9.1
  qr: ^3.0.2
  # NDK 0.9.3 requires hooks 1; sqlite3 3.6 requires hooks 2.
  sqlite3: ^3.5.2

  marketplace_evm:
    path: ../dependencies/nmdk/packages/marketplace_evm
dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0


# Coinlib 5 uses only RIPEMD160Digest.process, unchanged in PointyCastle 4.
# Web3dart 3 and wallet 0.0.18 require PointyCastle 4.
dependency_overrides:
  pointycastle: ^4.0.0
