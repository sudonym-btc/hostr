name: escrow
description: A Dart service that responds to Nostr messages and escrow events.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  escrow_daemon: bin/daemon

dependencies:
  logger: ^2.8.0
  hydrated_bloc: ^11.0.0
  convert: ^3.1.2
  marketplace_evm:
    path: ../dependencies/nmdk/packages/marketplace_evm
  get_it: ^9.2.1
  json_rpc_2: ^4.1.0
  stream_channel: ^2.1.4
  marketplace_models:
    path: ../dependencies/nmdk/packages/marketplace_models
  hostr_sdk:
    path: ../hostr_sdk
  ndk: ^0.9.3
  web3dart: ^3.0.3
  wallet: ^0.0.18

dev_dependencies:
  test: ^1.32.0

# Coinlib 5 uses only RIPEMD160Digest.process, unchanged in PointyCastle 4.
# Web3dart 3 and wallet 0.0.18 require PointyCastle 4.
dependency_overrides:
  pointycastle: ^4.0.0
