name: widgetbook_workspace
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  marketplace_evm:
    path: ../../dependencies/nmdk/packages/marketplace_evm
  bolt11_decoder: ^1.0.2
  flutter:
    sdk: flutter
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  hostr:
    path: ../
  hostr_sdk:
    path: ../../hostr_sdk
  marketplace_models:
    path: ../../dependencies/nmdk/packages/marketplace_models
  web3dart: ^3.0.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.24.0
  build_runner: ^2.16.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  mockito: ^5.8.1


flutter:
  uses-material-design: true


# Coinlib 5 uses only RIPEMD160Digest.process, unchanged in PointyCastle 4.
# Web3dart 3 and wallet 0.0.18 require PointyCastle 4.
dependency_overrides:
  pointycastle: ^4.0.0
