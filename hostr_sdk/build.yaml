targets:
  $default:
    builders:
      swagger_dart_code_generator:
        options:
          include_if_null: false
          input_folder: lib/datasources/swagger
          output_folder: lib/datasources/swagger_generated

      mockito|mockBuilder:
        generate_for:
          - lib/mocks/**.dart
        options:
          build_extensions:
            '^lib/mocks/{{}}.dart': 'lib/mocks/{{}}.mocks.dart'


builders:
  mockBuilder:
    import: "package:mockito/src/builder.dart"
    builder_factories: ["buildMocks"]
    build_extensions: {".dart": [".mocks.dart"]}
    build_to: source
    auto_apply: none
    defaults:
      generate_for: ['test/**', 'lib/mocks/**']