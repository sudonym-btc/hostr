name: hostr_sdk
description: A sample command-line application.
version: 1.0.0
publish_to: 'none'
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.0

# Add regular dependencies here.
dependencies:
  marketplace_evm:
    path: ../dependencies/nmdk/packages/marketplace_evm
  collection: ^1.19.1
  get_it: ^9.2.1
  marketplace_models:
    path: ../dependencies/nmdk/packages/marketplace_models
  ndk: ^0.9.3
  # ndk_rust_verifier: requires Flutter SDK
  injectable: ^3.0.0
  rxdart: ^0.28.0
  logger: ^2.8.0
  web3dart: ^3.0.3
  equatable: ^2.1.0
  coinlib: ^5.0.0
  wallet: ^0.0.18
  bolt11_decoder: ^1.0.2
  http: ^1.6.0
  hydrated_bloc: ^11.0.0
  chopper: ^8.7.0
  json_annotation: ^4.12.0
  bloc: ^9.2.1
  crypto: ^3.0.7
  bip39_mnemonic: ^4.1.0
  convert: ^3.1.2
  meta: ^1.19.0
  # NDK 0.9.3 requires hooks 1; sqlite3 3.6 requires hooks 2.
  sqlite3: ^3.5.2
  bip340: ^0.3.1
  mockito: ^5.8.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.16.1
  chopper_generator: ^8.7.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  lints: ^6.1.0
  swagger_dart_code_generator: ^4.1.1
  test: ^1.32.0


# Coinlib 5 uses only RIPEMD160Digest.process, unchanged in PointyCastle 4.
# Web3dart 3 and wallet 0.0.18 require PointyCastle 4.
dependency_overrides:
  pointycastle: ^4.0.0
