name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  # ── 1. Detect which submodules changed ─────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker_root: ${{ steps.filter.outputs.docker_root }}
      sdk: ${{ steps.filter.outputs.sdk }}
      app: ${{ steps.filter.outputs.app }}
      escrow: ${{ steps.filter.outputs.escrow }}
      mcp: ${{ steps.filter.outputs.mcp }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker_root:
              - 'docker-compose*.yml'
              - 'compose*.yaml'
              - 'docker/**'
              - 'scripts/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.env'
              - '.env.*'
              - '**/.env'
              - '**/.env.*'
            sdk:
              - 'hostr_sdk/**'
              - 'dependencies/nmdk'
              - 'dependencies/nmdk/**'
              - '.github/workflows/ci.yaml'
            app:
              - 'app/**'
              - 'hostr_sdk/**'
              - 'dependencies/nmdk'
              - 'dependencies/nmdk/**'
              - '.github/workflows/ci.yaml'
            escrow:
              - 'escrow/**'
              - 'dependencies/nmdk'
              - 'dependencies/nmdk/**'
              - 'hostr_sdk/**'
              - '.github/workflows/ci.yaml'
            mcp:
              - 'ai/mcp-server/**'
              - 'relay-authz/**'
              - '.github/workflows/ci.yaml'
            plugins:
              - 'ai/plugins/**'
              - '.agents/plugins/**'
              - 'scripts/validate-hostr-plugins.mjs'
              - '.github/workflows/ci.yaml'

  # ── 2. hostr_sdk tests (unit + Docker integration) ─────────────────────────
  test_sdk:
    name: Test — hostr_sdk
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.docker_root == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'

      - run: dart --version

      - name: Cache Dart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            hostr_sdk/.dart_tool
          key: ${{ runner.os }}-dart-${{ hashFiles('hostr_sdk/pubspec.yaml', 'hostr_sdk/pubspec.lock', 'dependencies/nmdk/packages/*/pubspec.yaml', 'dependencies/nmdk/packages/*/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-dart-

      - name: Install Docker Compose
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) compose_arch=x86_64 ;;
            aarch64|arm64) compose_arch=aarch64 ;;
            *)
              echo "Unsupported architecture for Docker Compose: $arch" >&2
              exit 1
              ;;
          esac

          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -fsSL \
            "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-${compose_arch}" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

      - name: Install dependencies
        run: dart pub get
        working-directory: hostr_sdk

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'

      - name: Enforce application and driver ownership
        run: |
          node scripts/check-payment-boundary.mjs
          node --test scripts/check-payment-boundary.test.mjs

      - name: Verify canonical Dart packages
        run: |
          for package in marketplace_models marketplace_evm; do
            (cd "dependencies/nmdk/packages/$package" && dart pub get && dart analyze && dart test)
          done

      # Start the Docker stack in the background while unit tests run.
      # This overlaps ~30-60s of image pulls / container boot with the
      # fast unit-test suite, shaving that time off the total CI run.
      #
      # NOTE: Each GitHub Actions `run:` block is a separate shell, so the
      # `wait` builtin cannot be used across steps (it only works for child
      # processes of the *current* shell).  We use nohup + disown to detach
      # the process, capture its exit code in a file, and poll with kill -0.
      - name: Start test stack (background)
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          nohup bash -c './scripts/restart.sh test; echo $? > /tmp/stack_exit' \
            > /tmp/stack.log 2>&1 &
          echo $! > /tmp/stack_pid
          disown
          echo "Docker stack starting in background (PID $(cat /tmp/stack_pid))"

      - name: Run unit tests
        run: dart test test/unit -t unit
        working-directory: hostr_sdk

      # If unit tests failed the job is already marked as failed and
      # subsequent steps without `if: always()` are skipped automatically.
      # Poll until the background restart.sh process exits, then check its
      # exit code from the file it wrote.
      - name: Wait for test stack
        timeout-minutes: 5
        run: |
          STACK_PID=$(cat /tmp/stack_pid)
          echo "Waiting for Docker stack (PID $STACK_PID) to finish…"
          while kill -0 "$STACK_PID" 2>/dev/null; do
            sleep 5
          done
          EXIT_CODE=$(cat /tmp/stack_exit 2>/dev/null || echo "1")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "--- Stack startup log (last 200 lines) ---"
            tail -200 /tmp/stack.log
            echo "::error::Docker stack startup failed (exit $EXIT_CODE)"
            exit 1
          fi
          echo "Docker stack is ready."

      - name: Add host aliases
        run: |
          echo "127.0.0.1 relay.hostr.development blossom.hostr.development telemetry.hostr.development alby.hostr.development lnbits.hostr.development rsk.hostr.development arbitrum.hostr.development boltz.hostr.development paymaster.hostr.development" | sudo tee -a /etc/hosts

      - name: Trust dev CA on runner
        run: |
          sudo cp docker/tls/ca/ca.crt /usr/local/share/ca-certificates/hostr-dev-ca.crt
          sudo update-ca-certificates

      - name: Run Docker integration tests
        run: dart test test/integration -t docker -j 1 -P ci
        working-directory: hostr_sdk

      - name: Show full test log on failure
        if: failure()
        run: cat test-results.txt 2>/dev/null || echo "No test log found"
        working-directory: hostr_sdk

      - name: Dump all container logs on failure
        if: failure()
        run: |
          echo "=== Stack startup log (last 100 lines) ==="
          tail -100 /tmp/stack.log 2>/dev/null || echo "(no stack log)"
          echo ""
          echo "=== Docker container status ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo ""
          for name in $(docker ps -a --format '{{.Names}}' | sort); do
            echo "════════════════════════════════════════════════════════════"
            echo "  Container: $name"
            echo "════════════════════════════════════════════════════════════"
            docker logs --tail=100 "$name" 2>&1 || echo "(failed to get logs)"
            echo ""
          done

      - name: Stop test stack
        if: always()
        run: docker compose down --remove-orphans --volumes

  # ── 3. Flutter app tests ────────────────────────────────────────────────────
  test_app:
    name: Test — app
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.docker_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.4'

      - run: flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('app/pubspec.yaml', 'app/pubspec.lock', 'app/widgetbook_workspace/pubspec.yaml', 'app/widgetbook_workspace/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: Clear generated Dart state
        run: rm -rf .dart_tool widgetbook_workspace/.dart_tool
        working-directory: app

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Run tests
        run: flutter test --coverage
        working-directory: app

      - name: Build Widgetbook (compile check)
        run: |
          flutter pub get
          flutter build web --no-wasm-dry-run
        working-directory: app/widgetbook_workspace

  # ── 4. Escrow daemon checks ───────────────────────────────────────────────
  test_escrow:
    name: Test — escrow
    needs: changes
    if: needs.changes.outputs.escrow == 'true' || needs.changes.outputs.docker_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'

      - run: dart --version

      - name: Cache Dart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            escrow/.dart_tool
          key: ${{ runner.os }}-dart-escrow-${{ hashFiles('escrow/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-dart-escrow-

      - name: Install dependencies
        run: dart pub get
        working-directory: escrow

      - name: Analyze (compile check)
        run: dart analyze
        working-directory: escrow

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: escrow/contracts/package-lock.json

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - name: Verify canonical contract deployment
        run: |
          npm ci
          npm run typecheck
          npm run compile
          npm test
        working-directory: escrow/contracts

  # ── 5. MCP server checks ───────────────────────────────────────────────────
  test_mcp:
    name: Test — MCP server
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.docker_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: ai/mcp-server/package-lock.json

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci
        working-directory: ai/mcp-server

      - name: Typecheck
        run: npm run typecheck
        working-directory: ai/mcp-server

      - name: Build
        run: npm run build
        working-directory: ai/mcp-server

      - name: Relay authorization tests
        run: npm ci && npm test
        working-directory: relay-authz

  mcp_compile:
    name: Compile — ai/mcp-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: ai/mcp-server/package-lock.json

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci
        working-directory: ai/mcp-server

      - name: Typecheck and build
        run: npm run typecheck && npm run build
        working-directory: ai/mcp-server

  hostr_plugins:
    name: Validate — Hostr Codex plugins
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - name: Validate plugin parity
        run: node scripts/validate-hostr-plugins.mjs

  dart_static:
    name: Analyze — hostr_cli + hostr_sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'

      - name: Install hostr_sdk dependencies
        run: dart pub get
        working-directory: hostr_sdk

      - name: Install hostr_cli dependencies
        run: dart pub get
        working-directory: hostr_cli

      - name: Analyze focused Dart packages
        run: dart analyze hostr_cli hostr_sdk

  focused_unit_tests:
    name: Focused Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: ai/mcp-server/package-lock.json

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'

      - name: MCP unit tests
        run: |
          npm ci
          npm run test:unit
        working-directory: ai/mcp-server

      - name: hostr_sdk trace unit test
        run: |
          dart pub get
          dart test test/unit/trace_context_test.dart
        working-directory: hostr_sdk

      - name: hostr_cli MCP contract unit tests
        run: |
          dart pub get
          dart test test/unit/hostr_actions_test.dart
        working-directory: hostr_cli

  docker_smoke:
    name: Docker Image Build Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build MCP image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%FT%TZ)" \
            --build-arg IMAGE_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t hostr-mcp-smoke:${GITHUB_SHA::7} \
            -f ai/mcp-server/Dockerfile .

  # ── 6. Quality gate — blocks release if any required test failed ────────────
  # Jobs that were skipped (no changes) are treated as passing.
  quality_gate:
    name: Quality Gate
    needs:
      [
        test_sdk,
        test_app,
        test_escrow,
        test_mcp,
        mcp_compile,
        hostr_plugins,
        dart_static,
        focused_unit_tests,
        docker_smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          sdk="${{ needs.test_sdk.result }}"
          app="${{ needs.test_app.result }}"
          escrow="${{ needs.test_escrow.result }}"
          mcp="${{ needs.test_mcp.result }}"
          mcp_compile="${{ needs.mcp_compile.result }}"
          hostr_plugins="${{ needs.hostr_plugins.result }}"
          dart_static="${{ needs.dart_static.result }}"
          focused_unit_tests="${{ needs.focused_unit_tests.result }}"
          docker_smoke="${{ needs.docker_smoke.result }}"
          failed=()
          for entry in "sdk:$sdk" "app:$app" "escrow:$escrow" "mcp:$mcp" "mcp_compile:$mcp_compile" "hostr_plugins:$hostr_plugins" "dart_static:$dart_static" "focused_unit_tests:$focused_unit_tests" "docker_smoke:$docker_smoke"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed+=("$name")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "❌ Failed jobs: ${failed[*]}"
            exit 1
          fi
            echo "✅ Quality gate passed (sdk=$sdk, app=$app, escrow=$escrow, mcp=$mcp, mcp_compile=$mcp_compile, hostr_plugins=$hostr_plugins, dart_static=$dart_static, focused_unit_tests=$focused_unit_tests, docker_smoke=$docker_smoke)"

          # ── 7. Semantic release (main only, after gate passes) ─────────────────────
  release:
    name: Release
    needs: quality_gate
    if: >
      needs.quality_gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.2'

      - name: Install current npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm clean-install

      - name: Verify provenance attestations
        run: npm audit signatures

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          # If semantic-release created a tag, signal downstream jobs
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 8. Build app artifacts (only when a new release was published) ─────────
  build:
    name: Build Apps
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: ./.github/workflows/app_build.yaml
    secrets: inherit

  # ── 9. Docker images → Artifact Registry (only when a new release was published)
  docker:
    name: Docker Build & Push
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: ./.github/workflows/docker_build.yaml
    with:
      variant: production
    permissions:
      contents: read
      id-token: write
    secrets: inherit
